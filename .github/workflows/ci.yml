name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # Live tests need real store credentials and are excluded by addopts.
        run: pytest -q

      - name: Server starts and lists its tools
        run: |
          python -c "
          import asyncio
          from storepilot.server import mcp, _register_adapters
          _register_adapters()
          tools = asyncio.run(mcp.list_tools())
          print(f'{len(tools)} tool(s) registered, version {mcp.version}')
          assert tools, 'no tools registered'
          assert mcp.version, 'server reports no version'
          "
