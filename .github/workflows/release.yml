name: Release

# Publishes to PyPI through Trusted Publishing (OIDC). There is no API token
# anywhere in this repo or in its secrets: PyPI verifies the workflow's identity
# directly, so there is nothing to leak or rotate.
#
# PyPI's trusted publisher for this project is pinned to
# sonlenef/storepilot-mcp, this filename, and the "pypi" environment. Renaming
# any of the three breaks publishing until the publisher is updated to match.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Refuse to ship a red build
        run: |
          ruff check .
          pytest -q

      - name: Tag must match the packaged version
        # A tag that disagrees with pyproject publishes a version nobody can
        # trace back to a commit, and PyPI will not let it be replaced.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$pkg"
          test "$tag" = "$pkg"

      - name: Build
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token PyPI verifies; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
